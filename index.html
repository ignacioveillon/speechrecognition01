<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deutsches Diktat</title>

<style>

body{
    margin:0;
    padding:40px;
    font-family:Arial;
    background:#f2f2f2;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
}

button{
    padding:12px 18px;
    font-size:16px;
    margin-right:10px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

#start{
    background:#1e88e5;
    color:white;
}

#stop{
    background:#e53935;
    color:white;
}

#output{
    margin-top:20px;
    padding:15px;
    background:#fafafa;
    border:1px solid #ddd;
    min-height:200px;
    white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="container">

<h2>Kontinuierliches Diktat (Deutsch)</h2>

<button id="start">Start</button>
<button id="stop">Stop</button>

<div id="output"></div>

</div>

<script>

const output = document.getElementById("output");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
    output.innerText = "SpeechRecognition nicht unterstützt.";
}

const recognition = new SpeechRecognition();

recognition.lang = "de-DE";
recognition.continuous = true;
recognition.interimResults = true;

let finalText = "";
let isRunning = false;
let restartTimeout;

function startRecognition() {
    if (!isRunning) return;

    try {
        recognition.start();
    } catch (e) {
        // evita error por reinicio duplicado
    }
}

recognition.onresult = (event) => {

    let interimText = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {

        const transcript = event.results[i][0].transcript;

        if (event.results[i].isFinal) {
            finalText += transcript + " ";
        } else {
            interimText += transcript;
        }
    }

    output.innerText = finalText + interimText;

    clearTimeout(restartTimeout);

    restartTimeout = setTimeout(() => {
        recognition.stop();
    }, 1200);

};

recognition.onend = () => {
    if (isRunning) {
        startRecognition();
    }
};

startBtn.onclick = () => {
    finalText = "";
    isRunning = true;
    recognition.start();
};

stopBtn.onclick = () => {
    isRunning = false;
    recognition.stop();
};

</script>

</body>
</html>
